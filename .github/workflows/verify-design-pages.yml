name: Verify live MNEMORA redesign

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.verify-design-pages-trigger'

permissions:
  contents: read
  actions: write

jobs:
  verify-live-page:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Wait for redesigned production bundle
        shell: bash
        run: |
          set -euo pipefail
          page='https://markofornoliak.github.io/MNEMORA/'
          for attempt in $(seq 1 60); do
            html="$(curl -fsSL --max-time 20 "$page" || true)"
            asset="$(printf '%s' "$html" | grep -oE 'assets/index-[^" ]+\.js' | head -n 1 || true)"
            if [[ -n "$asset" ]] && curl -fsSL --max-time 30 "$page$asset" -o /tmp/mnemora-app.js; then
              if grep -Fq 'Interactive programming curriculum' /tmp/mnemora-app.js && grep -Fq 'learning observatory 2.0' /tmp/mnemora-app.js; then
                echo "Live MNEMORA redesign verified at $page"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'The public Pages bundle did not expose the redesigned MNEMORA markers.' >&2
          exit 1
