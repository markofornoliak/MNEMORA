name: Verify and publish complete MNEMORA source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.publish-v3/trigger'

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and verify complete source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .publish-v3 -maxdepth 1 -name 'chunk-*' | wc -l)" -eq 5
          cat .publish-v3/chunk-* > /tmp/mnemora-source.b64
          base64 --decode /tmp/mnemora-source.b64 > /tmp/mnemora-source.tar.xz
          echo "766010631205a93ddb529f31d6fdd5aaaa7b06b523578211f92a6d625b3dec6e  /tmp/mnemora-source.tar.xz" | sha256sum --check --strict
          xz --test /tmp/mnemora-source.tar.xz
          mkdir -p /tmp/mnemora-project
          tar -xJf /tmp/mnemora-source.tar.xz --strip-components=1 -C /tmp/mnemora-project

      - name: Apply verified source fixes
        working-directory: /tmp/mnemora-project
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/.publish-v3/source-fixes.patch.xz.b64" > /tmp/mnemora-source-fixes.patch.xz
          echo "784e1f96fcc828e96af4a4b42f3cbc4387c27e39e7b01152ba9fb56a056afe48  /tmp/mnemora-source-fixes.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/mnemora-source-fixes.patch.xz > /tmp/mnemora-source-fixes.patch
          git apply --check /tmp/mnemora-source-fixes.patch
          git apply /tmp/mnemora-source-fixes.patch

      - name: Verify complete content tree
        working-directory: /tmp/mnemora-project
        shell: bash
        run: |
          set -euo pipefail
          test -f src/main.tsx
          test -f src/components/CodeLab.tsx
          test -f src/features/code-runner/runner.ts
          test -f .github/workflows/ci.yml
          test -f .github/workflows/deploy.yml
          test "$(find src/data/tracks -path '*/lessons/*.ts' | wc -l)" -eq 60
          test "$(find . -type f ! -path './node_modules/*' ! -path './dist/*' | wc -l)" -ge 119

      - name: Install dependencies
        working-directory: /tmp/mnemora-project
        run: npm install --no-audit --no-fund

      - name: Audit course content
        working-directory: /tmp/mnemora-project
        run: npm run audit:content

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        working-directory: /tmp/mnemora-project
        shell: bash
        run: npm run typecheck > /tmp/mnemora-typecheck.log 2>&1

      - name: Upload TypeScript diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mnemora-typecheck-diagnostics
          path: /tmp/mnemora-typecheck.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop on TypeScript errors
        if: steps.typecheck.outcome == 'failure'
        shell: bash
        run: |
          tail -n 200 /tmp/mnemora-typecheck.log
          exit 1

      - name: Lint
        working-directory: /tmp/mnemora-project
        run: npm run lint

      - name: Test
        working-directory: /tmp/mnemora-project
        run: npm run test

      - name: Build production application
        working-directory: /tmp/mnemora-project
        run: npm run build

      - name: Record GitHub-hosted verification
        working-directory: /tmp/mnemora-project
        shell: bash
        run: |
          cat >> QUALITY_GATE.md <<'EOF'

          ## GitHub-hosted verification

          The publication workflow installed all declared dependencies on Node.js 22 and passed the content audit, TypeScript typecheck, ESLint, Vitest, and the production Vite build before committing this source tree.
          EOF

      - name: Replace transport repository with complete project
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mnemora-project/. "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete MNEMORA source and fixes"
          git push origin HEAD:${{ github.head_ref }}
