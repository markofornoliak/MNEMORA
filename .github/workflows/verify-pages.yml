name: Dispatch and verify MNEMORA Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.pages-dispatch-trigger'

permissions:
  actions: write
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Wait for the verified live page
        shell: bash
        run: |
          set -euo pipefail
          url="https://markofornoliak.github.io/MNEMORA/"
          for attempt in $(seq 1 36); do
            if html=$(curl --fail --silent --show-error --location --max-time 20 "$url"); then
              if grep -Fq '<title>MNEMORA — Code Observatory</title>' <<< "$html" && grep -Fq '<div id="root"></div>' <<< "$html"; then
                echo "Verified live page: $url"
                exit 0
              fi
            fi
            echo "Page not ready yet (attempt $attempt/36)"
            sleep 10
          done
          echo "GitHub Pages did not expose the verified MNEMORA build in time" >&2
          exit 1
