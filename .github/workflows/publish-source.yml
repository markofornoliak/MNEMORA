name: Publish MNEMORA source

on:
  push:
    branches: [main]
    paths:
      - '.payload/**'
      - '.github/workflows/publish-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/chunk-* > /tmp/mnemora.b64
          base64 --decode /tmp/mnemora.b64 > /tmp/mnemora.tar.xz
          echo "0a795546f89bb05e9c0ebcbcebcf402243517d09fd7a66feceedeff68876f3c5  /tmp/mnemora.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/mnemora-unpack
          tar -xJf /tmp/mnemora.tar.xz -C /tmp/mnemora-unpack
          test -f /tmp/mnemora-unpack/mnemora/package.json
          test -f /tmp/mnemora-unpack/mnemora/src/main.tsx

      - name: Replace temporary payload with project source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mnemora-unpack/mnemora/. .

      - name: Commit published project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish MNEMORA Code Observatory"
          git push origin main
